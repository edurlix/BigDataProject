# Configuración del universo. Las URLs por país siguen soportadas por el
# framework para compatibilidad, pero la entrega usa peticiones globales.

universe: true

# Equivalencias declarativas entre códigos externos e ISO3.
code_aliases:
  EL: GRC
  UK: GBR
  XK: XKX

# Se conserva como muestra y para ejecutar pruebas pequeñas; no limita el universo.
focus_countries:
  - { iso2: ES, iso3: ESP }
  - { iso2: FR, iso3: FRA }
  - { iso2: DE, iso3: DEU }
  - { iso2: IT, iso3: ITA }
  - { iso2: PT, iso3: PRT }

sources:
  - id: countries_profile
    name: mledoze/countries (perfil e idiomas)
    url: https://raw.githubusercontent.com/mledoze/countries/master/countries.json
    format: json
    role: profile
    transformer: countries_profile

  - id: worldbank_gdp
    name: World Bank — PIB per cápita (NY.GDP.PCAP.CD)
    url: >-
      https://api.worldbank.org/v2/country/all/indicator/NY.GDP.PCAP.CD?format=json&per_page=20000
    paginate: worldbank
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: NY.GDP.PCAP.CD
      indicator_label: GDP per capita (current US$)
      unit: USD

  - id: eurostat_pop
    name: Eurostat — población (demo_pjan)
    url: >-
      https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/demo_pjan?format=JSON&lang=en&sex=T&age=TOTAL
    format: json
    role: indicator
    transformer: eurostat_demo_pjan
    meta:
      indicator_id: demo_pjan
      indicator_label: Population on 1 January
      unit: persons

  - id: owid_life_expectancy
    name: Our World in Data — life expectancy (CSV)
    url: >-
      https://ourworldindata.org/grapher/life-expectancy.csv?v=1&csvType=full&useColumnShortNames=false
    format: csv
    role: indicator
    transformer: owid_life_expectancy
    meta:
      indicator_id: life_expectancy
      indicator_label: Life expectancy
      unit: years
  
  - id: worldbank_pop
    name: World Bank — población total (SP.POP.TOTL)
    url: >-
      https://api.worldbank.org/v2/country/all/indicator/SP.POP.TOTL?format=json&per_page=20000
    paginate: worldbank
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: SP.POP.TOTL
      indicator_label: Population, total
      unit: persons

  - id: worldbank_life_expectancy
    name: World Bank — esperanza de vida (SP.DYN.LE00.IN)
    url: >-
      https://api.worldbank.org/v2/country/all/indicator/SP.DYN.LE00.IN?format=json&per_page=20000
    paginate: worldbank
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: SP.DYN.LE00.IN
      indicator_label: Life expectancy at birth
      unit: years

  - id: worldbank_unemployment
    name: World Bank — desempleo (SL.UEM.TOTL.ZS)
    url: >-
      https://api.worldbank.org/v2/country/all/indicator/SL.UEM.TOTL.ZS?format=json&per_page=20000
    paginate: worldbank
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: SL.UEM.TOTL.ZS
      indicator_label: Unemployment, total
      unit: percent

  - id: worldbank_internet
    name: World Bank — uso de Internet (IT.NET.USER.ZS)
    url: >-
      https://api.worldbank.org/v2/country/all/indicator/IT.NET.USER.ZS?format=json&per_page=20000
    paginate: worldbank
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: IT.NET.USER.ZS
      indicator_label: Individuals using the Internet
      unit: percent

  - id: worldbank_co2
    name: World Bank — CO2 per cápita (EN.ATM.CO2E.PC)
    url: >-
      https://api.worldbank.org/v2/country/all/indicator/EN.ATM.CO2E.PC?format=json&per_page=20000
    paginate: worldbank
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: EN.ATM.CO2E.PC
      indicator_label: CO2 emissions per capita
      unit: metric tons per capita
